<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

            </div>

            <nav class="menu">
                <a href="home.html">Home</a>
                <a href="about.html">About</a>
                <a href="attractions.html">Attractions</a>
                <a href="gallery.html">Gallery</a>
                <a href="travel.html">Travel Info</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>

        <div class="hero-copy">
            <p class="hero-welcome">Welcome to MonteMaria</p>
            <p class="hero-subtitle">The Mother of All Asia</p>
        </div>

    </div>

    <div class="featured-section">

        <h1>Featured Blogs and Reviews</h1>

        <div class="home-container">

            <a href="https://suroy.ph/montemaria-mother-of-all-asia-tower-of-peace/">

                    <img src="images/photo_2026-05-12_02-16-02.jpg">

                </div>
            </a>

            <a href="https://balikbayanmagazine.com/travel/destinations/taking-it-easy-relaxing-things-to-do-in-montemaria/">

            <a href="https://www.wanderwahm.com/2020/02/monte-maria-shrine-and-mt-salvation.html">

                    <img src="images/photo_2026-05-12_02-03-47.jpg">
                    <p>Tower of Peace</p>
                </div>
            </a>

        </div>

    </div>

    <script>
        const topbar = document.querySelector('.topbar');
        let lastScrollY = window.pageYOffset;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.pageYOffset;
            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                topbar.classList.add('topbar-hidden');
            } else {
                topbar.classList.remove('topbar-hidden');
            }
            lastScrollY = currentScrollY;
        });
    </script>
</body>
